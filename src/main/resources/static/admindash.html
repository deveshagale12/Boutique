<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique BI | Master Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; padding-bottom: 100px; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .pbi-accent { border-left: 4px solid #fbbf24; }
        .input-premium { background: #0f172a !important; border: 1px solid #334155 !important; color: white !important; border-radius: 12px !important; padding: 12px !important; width: 100% !important; margin-top: 5px !important; }
        
        /* Navigation Styles */
        .tab-btn { transition: all 0.3s ease; border: 1px solid transparent; text-align: left; width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; font-weight: 600; color: #94a3b8; }
        .tab-btn.active { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border-color: rgba(251, 191, 36, 0.2); }
        
        /* Action Icons */
        .action-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; transition: 0.2s; }
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }

        /* Image Upload Grid */
        .slot-box { position: relative; aspect-ratio: 3/4; background: #0f172a; border: 2px dashed #334155; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .preview-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 10; display: none; }
        
        /* Mobile Session Bar */
        .mobile-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 lg:p-10">

    <aside class="hidden lg:flex fixed left-0 top-0 h-full w-64 glass-panel flex-col p-6 border-r border-white/5">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-8 h-8 bg-yellow-400 rounded-lg"></div>
            <span class="text-xl font-bold tracking-tighter uppercase">Boutique<span class="text-yellow-400">BI</span></span>
        </div>
        <nav class="space-y-2 flex-1">
            <button onclick="switchTab('inventory')" id="tab-inv" class="tab-btn active">📦 Inventory</button>
            <button onclick="switchTab('orders')" id="tab-ord" class="tab-btn">🛍️ Orders</button>
            <button onclick="switchTab('users')" id="tab-usr" class="tab-btn">👥 Users</button>
            <button onclick="refreshData()" class="tab-btn text-slate-400 mt-4">🔄 Sync Data</button>
        </nav>
        <button onclick="logout()" class="flex items-center gap-3 p-3 text-rose-400 font-bold mt-auto">🚪 Logout</button>
    </aside>

    <main class="lg:ml-64 max-w-[1400px] mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 id="page-title" class="text-3xl font-bold text-white tracking-tight uppercase">Inventory</h1>
                <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Systems Active
                </p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search..." class="glass-panel text-sm px-4 py-3 rounded-xl focus:outline-none focus:border-yellow-400 w-full md:w-64">
                <button id="add-btn" onclick="openAddModal()" class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-3 rounded-xl font-bold transition-transform active:scale-95">+ Add SKU</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-panel p-6 rounded-2xl pbi-accent">
                <p id="stat-1-label" class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Active Data</p>
                <h2 id="stat-1-val" class="text-3xl font-bold mt-1 text-white">0</h2>
            </div>
            <div class="glass-panel p-6 rounded-2xl">
                <p id="stat-2-label" class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Valuation</p>
                <h2 id="stat-2-val" class="text-3xl font-bold mt-1 text-emerald-400">₹0</h2>
            </div>
            <div class="glass-panel p-6 rounded-2xl">
                <p id="stat-3-label" class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Alerts</p>
                <h2 id="stat-3-val" class="text-3xl font-bold mt-1 text-rose-500">0</h2>
            </div>
        </div>

        <div id="inventory-section" class="glass-panel rounded-3xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-white/[0.03] text-slate-500 text-[10px] font-bold uppercase border-b border-white/5">
                        <tr>
                            <th class="p-6">Gallery</th><th class="p-6">Product</th><th class="p-6">Category</th><th class="p-6">Price/Stock</th><th class="p-6 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="product-rows" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>

        <div id="orders-section" class="glass-panel rounded-3xl overflow-hidden shadow-2xl hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-white/[0.03] text-slate-500 text-[10px] font-bold uppercase border-b border-white/5">
                        <tr>
                            <th class="p-6">Order ID</th><th class="p-6">Customer (Name/Mob)</th><th class="p-6">Product</th><th class="p-6">Qty</th><th class="p-6">Status</th><th class="p-6 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="order-rows" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>

        <div id="users-section" class="glass-panel rounded-3xl overflow-hidden shadow-2xl hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-white/[0.03] text-slate-500 text-[10px] font-bold uppercase border-b border-white/5">
                        <tr>
                            <th class="p-6">User ID</th><th class="p-6">Full Name</th><th class="p-6">Email Address</th><th class="p-6">Mobile</th><th class="p-6">Joined</th>
                        </tr>
                    </thead>
                    <tbody id="user-rows" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="lg:hidden fixed bottom-0 left-0 right-0 z-50 mobile-nav flex justify-around items-center p-4">
        <button onclick="switchTab('inventory')" class="flex flex-col items-center gap-1">
            <span class="text-xl">📦</span><span class="text-[9px] font-bold uppercase">Stock</span>
        </button>
        <button onclick="switchTab('orders')" class="flex flex-col items-center gap-1">
            <span class="text-xl">🛍️</span><span class="text-[9px] font-bold uppercase">Orders</span>
        </button>
        <button onclick="switchTab('users')" class="flex flex-col items-center gap-1">
            <span class="text-xl">👥</span><span class="text-[9px] font-bold uppercase">Users</span>
        </button>
    </div>

    <div id="imageModal" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div class="glass-panel w-full max-w-2xl rounded-3xl p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Manage Gallery: #<span id="target-id"></span></h2>
                <button onclick="closeImageModal()" class="text-slate-400 text-2xl">✕</button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <script>
                    for(let i=0; i<4; i++) {
                        document.write(`
                            <div class="slot-box">
                                <img id="pv-${i}" class="preview-img">
                                <div class="text-center"><span class="text-xl">📸</span><p class="text-[8px] uppercase font-bold text-slate-500 mt-1">Slot ${i+1}</p></div>
                                <input type="file" accept="image/*" onchange="previewFile(event, ${i})" class="absolute inset-0 opacity-0 cursor-pointer z-20">
                            </div>
                        `);
                    }
                </script>
            </div>
            <button onclick="submitBatchUpload()" class="w-full bg-yellow-400 text-black font-bold py-4 rounded-xl">Sync to Cloud</button>
        </div>
    </div>

    <script>
        const API_BASE = "https://boutique-0j9i.onrender.com/api/boutique";
        const API_KEY = "my-secret-boutique-key-2026";
        let activeId = null;
        let selectedFiles = [null, null, null, null];
        let currentTab = 'inventory';

        window.onload = refreshData;

        function switchTab(tab) {
            currentTab = tab;
            ['inv', 'ord', 'usr'].forEach(t => document.getElementById(`tab-${t}`).classList.remove('active'));
            document.getElementById(`tab-${tab.substring(0,3)}`).classList.add('active');
            
            document.getElementById('inventory-section').classList.add('hidden');
            document.getElementById('orders-section').classList.add('hidden');
            document.getElementById('users-section').classList.add('hidden');
            document.getElementById(`${tab}-section`).classList.remove('hidden');

            document.getElementById('add-btn').classList.toggle('hidden', tab !== 'inventory');
            document.getElementById('page-title').innerText = tab === 'inventory' ? 'Inventory' : (tab === 'orders' ? 'Logistics' : 'Users');
            refreshData();
        }

        async function refreshData() {
            try {
                if(currentTab === 'inventory') {
                    const res = await fetch(`${API_BASE}/admin/products/all`, { headers: { 'X-API-KEY': API_KEY }});
                    renderInventory(await res.json());
                } else if(currentTab === 'orders') {
                    const res = await fetch(`${API_BASE}/orders/admin/all`, { headers: { 'X-API-KEY': API_KEY }});
                    renderOrders(await res.json());
                } else {
                    const res = await fetch(`${API_BASE}/auth/users/all`, { headers: { 'X-API-KEY': API_KEY }});
                    renderUsers(await res.json());
                }
            } catch (err) { console.error("Sync Failed", err); }
        }

        function renderInventory(products) {
            document.getElementById('stat-1-label').innerText = "Total SKUs";
            document.getElementById('stat-1-val').innerText = products.length;
            const val = products.reduce((acc, p) => acc + (p.price * p.stockQuantity), 0);
            document.getElementById('stat-2-val').innerText = `₹${val.toLocaleString()}`;

            document.getElementById('product-rows').innerHTML = products.map(p => `
                <tr>
                    <td class="p-6"><img src="${API_BASE}/admin/products/${p.id}/image/0?v=${Date.now()}" class="w-10 h-12 rounded object-cover" onerror="this.src='https://placehold.co/40x50/1e293b/475569?text=X'"></td>
                    <td class="p-6"><div class="font-bold text-white text-sm">${p.name}</div><div class="text-[9px] text-slate-500 uppercase">ID: ${p.id}</div></td>
                    <td class="p-6"><span class="px-2 py-1 bg-yellow-400/10 text-yellow-400 text-[9px] font-bold rounded uppercase border border-yellow-400/20">${p.category}</span></td>
                    <td class="p-6 text-sm"><div class="font-bold text-white">₹${p.price.toLocaleString()}</div><div class="text-[10px] text-slate-400 mt-1">Stock: ${p.stockQuantity}</div></td>
                    <td class="p-6">
                        <div class="flex justify-center gap-2">
                            <button onclick="openImageModal(${p.id})" class="action-icon bg-emerald-500/10 text-emerald-500">📸</button>
                            <button onclick='openEditModal(${JSON.stringify(p)})' class="action-icon bg-blue-500/10 text-blue-400">✏️</button>
                            <button onclick="handleDelete(${p.id})" class="action-icon bg-rose-500/10 text-rose-500">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderOrders(orders) {
            document.getElementById('stat-1-label').innerText = "Total Orders";
            document.getElementById('stat-1-val').innerText = orders.length;
            document.getElementById('order-rows').innerHTML = orders.map(o => `
                <tr>
                    <td class="p-6 text-xs text-yellow-400 font-bold">#ORD-${o.id}</td>
                    <td class="p-6"><div class="text-sm font-bold text-white">${o.user?.fullName || o.user?.name || 'Guest'}</div><div class="text-[10px] text-yellow-400">${o.user?.mobile || 'No Mobile'}</div></td>
                    <td class="p-6 text-sm text-white">${o.product?.name || 'Deleted'}</td>
                    <td class="p-6 text-sm text-white">${o.quantity}</td>
                    <td class="p-6"><span class="status-badge ${o.status === 'ACCEPTED' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-yellow-400/20 text-yellow-400'}">${o.status}</span></td>
                    <td class="p-6 text-center">
                        ${o.status === 'PENDING' ? `<button onclick="updateOrderStatus(${o.id}, 'ACCEPTED')" class="bg-emerald-500 text-black px-4 py-1 rounded font-bold text-[10px]">Accept</button>` : `<button onclick="deleteOrder(${o.id})" class="text-rose-500 text-xs">🗑️ Clear</button>`}
                    </td>
                </tr>
            `).reverse().join('');
        }

        function renderUsers(users) {
            document.getElementById('stat-1-label').innerText = "Total Members";
            document.getElementById('stat-1-val').innerText = users.length;
            document.getElementById('user-rows').innerHTML = users.map(u => `
                <tr>
                    <td class="p-6 text-xs text-yellow-400 font-bold">#UID-${u.id}</td>
                    <td class="p-6 text-sm font-bold text-white">${u.fullName || u.name}</td>
                    <td class="p-6 text-sm text-slate-400">${u.email}</td>
                    <td class="p-6 text-sm text-slate-400 font-mono">${u.mobile || 'N/A'}</td>
                    <td class="p-6 text-xs text-slate-500 font-bold">2026-Member</td>
                </tr>
            `).reverse().join('');
        }

        // --- HANDLERS ---
        async function openAddModal() {
            const { value: f } = await Swal.fire({
                title: 'Add New Product', background: '#0f172a', color: '#fff',
                html: `<input id="n-name" placeholder="Name" class="input-premium"><input id="n-price" type="number" placeholder="Price" class="input-premium"><input id="n-stock" type="number" placeholder="Stock" class="input-premium"><input id="n-cat" placeholder="Category" class="input-premium">`,
                preConfirm: () => ({ name: document.getElementById('n-name').value, price: document.getElementById('n-price').value, stockQuantity: document.getElementById('n-stock').value, category: document.getElementById('n-cat').value })
            });
            if(f) { 
                await fetch(`${API_BASE}/admin/products/add`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-API-KEY': API_KEY }, body: JSON.stringify(f) }); 
                refreshData(); 
            }
        }

        async function openEditModal(p) {
            const { value: f } = await Swal.fire({
                title: 'Edit Product', background: '#0f172a', color: '#fff',
                html: `<input id="e-name" value="${p.name}" class="input-premium"><input id="e-price" type="number" value="${p.price}" class="input-premium"><input id="e-stock" type="number" value="${p.stockQuantity}" class="input-premium"><input id="e-cat" value="${p.category}" class="input-premium">`,
                preConfirm: () => ({ id: p.id, name: document.getElementById('e-name').value, price: document.getElementById('e-price').value, stockQuantity: document.getElementById('e-stock').value, category: document.getElementById('e-cat').value })
            });
            if(f) {
                await fetch(`${API_BASE}/admin/products/update/${p.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-API-KEY': API_KEY }, body: JSON.stringify(f) });
                refreshData();
            }
        }

        async function handleDelete(id) {
            if((await Swal.fire({ title: 'Delete Item?', icon: 'warning', showCancelButton: true, background: '#0f172a', color: '#fff' })).isConfirmed) {
                await fetch(`${API_BASE}/admin/products/delete/${id}`, { method: 'DELETE', headers: { 'X-API-KEY': API_KEY } });
                refreshData();
            }
        }

        async function updateOrderStatus(id, status) {
            await fetch(`${API_BASE}/orders/admin/update/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-API-KEY': API_KEY }, body: JSON.stringify({ status })});
            refreshData();
        }

        // --- IMAGE MODAL LOGIC ---
        function openImageModal(id) { activeId = id; document.getElementById('target-id').innerText = id; document.getElementById('imageModal').classList.remove('hidden'); }
        function closeImageModal() { document.getElementById('imageModal').classList.add('hidden'); }
        function previewFile(e, i) { const file = e.target.files[0]; if(file) { selectedFiles[i] = file; document.getElementById(`pv-${i}`).src = URL.createObjectURL(file); document.getElementById(`pv-${i}`).style.display = 'block'; } }
        async function submitBatchUpload() {
            const fd = new FormData();
            selectedFiles.forEach(f => { if(f) fd.append('files', f); });
            await fetch(`${API_BASE}/admin/products/${activeId}/upload-images`, { method: 'POST', headers: { 'X-API-KEY': API_KEY }, body: fd });
            closeImageModal(); refreshData();
        }

        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('tbody tr').forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none');
        }

        function logout() { location.href = "admin-auth.html"; }
    </script>
</body>
</html>
