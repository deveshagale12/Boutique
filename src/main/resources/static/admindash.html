<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique BI | Master Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; margin-bottom: 100px; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .pbi-accent { border-left: 4px solid #fbbf24; }
        .input-premium { background: #0f172a !important; border: 1px solid #334155 !important; color: white !important; border-radius: 12px !important; padding: 12px !important; width: 100% !important; margin-top: 5px !important; }
        .slot-box { position: relative; aspect-ratio: 3/4; background: #0f172a; border: 2px dashed #334155; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; cursor: pointer; }
        .slot-box:hover { border-color: #fbbf24; background: #1e293b; }
        .preview-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 10; display: none; }
        .action-icon { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; transition: 0.2s; cursor: pointer; }
        /* Gallery Strip Styling */
        .gallery-mini { display: flex; gap: 4px; }
        .gallery-mini img { width: 32px; height: 40px; border-radius: 4px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); background: #0f172a; }
    </style>
</head>
<body class="p-4 lg:p-10">

    <aside class="hidden lg:flex fixed left-0 top-0 h-full w-64 glass-panel flex-col p-6 border-r border-white/5">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-8 h-8 bg-yellow-400 rounded-lg shadow-[0_0_15px_rgba(251,191,36,0.4)]"></div>
            <span class="text-xl font-bold tracking-tighter">BOUTIQUE<span class="text-yellow-400">BI</span></span>
        </div>
        <nav class="space-y-2 flex-1">
            <a href="#" class="flex items-center gap-3 p-3 bg-white/5 rounded-xl text-yellow-400 font-semibold border border-white/5">📦 Inventory</a>
            <button onclick="refreshData()" class="w-full flex items-center gap-3 p-3 text-slate-400 hover:text-white transition-all text-left">🔄 Sync NeonDB</button>
        </nav>
        <button onclick="logout()" class="flex items-center gap-3 p-3 text-rose-400 hover:bg-rose-500/10 rounded-xl transition-all font-bold mt-auto">🚪 Logout</button>
    </aside>

    <main class="lg:ml-64 max-w-[1400px] mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Inventory Intelligence</h1>
                <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Cloud API Active
                </p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search Products..." class="glass-panel text-sm px-4 py-3 rounded-xl focus:outline-none focus:border-yellow-400 w-full md:w-64">
                <button onclick="openAddModal()" class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-3 rounded-xl font-bold shadow-lg transition-transform active:scale-95 whitespace-nowrap">+ Add New</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-panel p-6 rounded-2xl pbi-accent">
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Active SKUs</p>
                <h2 id="total-items" class="text-3xl font-bold mt-1 text-white">0</h2>
            </div>
            <div class="glass-panel p-6 rounded-2xl">
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Total Valuation</p>
                <h2 id="total-val" class="text-3xl font-bold mt-1 text-emerald-400">₹0</h2>
            </div>
            <div class="glass-panel p-6 rounded-2xl">
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Low Stock Alert</p>
                <h2 id="low-stock" class="text-3xl font-bold mt-1 text-rose-500">0 Alerts</h2>
            </div>
        </div>

        <div class="glass-panel rounded-3xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-white/[0.03] text-slate-500 text-[10px] font-bold uppercase tracking-widest border-b border-white/5">
                        <tr>
                            <th class="p-6">Gallery (Main/Side/Back/Detail)</th>
                            <th class="p-6">Product Details</th>
                            <th class="p-6">Category</th>
                            <th class="p-6">Price & Stock</th>
                            <th class="p-6 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="product-rows" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="imageModal" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-4 bg-black/95 backdrop-blur-sm">
        <div class="glass-panel w-full max-w-2xl rounded-3xl p-8 border border-white/10">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Manage Gallery: <span id="target-id" class="text-yellow-400"></span></h2>
                <button onclick="closeImageModal()" class="text-slate-400 hover:text-white text-2xl">✕</button>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="slot-box">
                    <img id="pv-0" class="preview-img">
                    <div class="text-center z-0"><span class="text-xl">📸</span><p class="text-[8px] uppercase font-bold text-slate-500 mt-1">Main View</p></div>
                    <input type="file" accept="image/*" onchange="previewFile(event, 0)" class="absolute inset-0 opacity-0 cursor-pointer z-20">
                </div>
                <div class="slot-box">
                    <img id="pv-1" class="preview-img">
                    <div class="text-center z-0"><span class="text-xl">📸</span><p class="text-[8px] uppercase font-bold text-slate-500 mt-1">Side View</p></div>
                    <input type="file" accept="image/*" onchange="previewFile(event, 1)" class="absolute inset-0 opacity-0 cursor-pointer z-20">
                </div>
                <div class="slot-box">
                    <img id="pv-2" class="preview-img">
                    <div class="text-center z-0"><span class="text-xl">📸</span><p class="text-[8px] uppercase font-bold text-slate-500 mt-1">Back View</p></div>
                    <input type="file" accept="image/*" onchange="previewFile(event, 2)" class="absolute inset-0 opacity-0 cursor-pointer z-20">
                </div>
                <div class="slot-box">
                    <img id="pv-3" class="preview-img">
                    <div class="text-center z-0"><span class="text-xl">📸</span><p class="text-[8px] uppercase font-bold text-slate-500 mt-1">Detail View</p></div>
                    <input type="file" accept="image/*" onchange="previewFile(event, 3)" class="absolute inset-0 opacity-0 cursor-pointer z-20">
                </div>
            </div>

            <button onclick="submitBatchUpload()" class="w-full bg-yellow-400 text-black font-bold py-4 rounded-xl hover:bg-yellow-500 transition-all shadow-lg shadow-yellow-400/20">
                Confirm & Sync to NeonDB
            </button>
        </div>
    </div>

    <script>
        const API_BASE = "https://boutique-0j9i.onrender.com/api/boutique/admin/products";
        const API_KEY = "my-secret-boutique-key-2026";
        let activeId = null;
        let selectedFiles = [null, null, null, null];

        window.onload = refreshData;

        async function refreshData() {
            try {
                const res = await fetch(`${API_BASE}/all`, { headers: { 'X-API-KEY': API_KEY }});
                const products = await res.json();
                renderTable(products);
            } catch (err) { console.error("Sync Error:", err); }
        }

        function renderTable(products) {
            document.getElementById('total-items').innerText = products.length;
            const val = products.reduce((acc, p) => acc + (p.price * p.stockQuantity), 0);
            document.getElementById('total-val').innerText = `₹${val.toLocaleString('en-IN')}`;
            document.getElementById('low-stock').innerText = `${products.filter(p => p.stockQuantity < 5).length} Alerts`;

            const list = document.getElementById('product-rows');
            list.innerHTML = products.map(p => `
                <tr class="product-item">
                    <td class="p-6">
                        <div class="gallery-mini">
                            <img src="${API_BASE}/${p.id}/image/0?v=${Date.now()}" onerror="this.src='https://placehold.co/40x50/1e293b/475569?text=X'">
                            <img src="${API_BASE}/${p.id}/image/1?v=${Date.now()}" onerror="this.style.display='none'">
                            <img src="${API_BASE}/${p.id}/image/2?v=${Date.now()}" onerror="this.style.display='none'">
                            <img src="${API_BASE}/${p.id}/image/3?v=${Date.now()}" onerror="this.style.display='none'">
                        </div>
                    </td>
                    <td class="p-6">
                        <div class="font-bold text-white text-sm">${p.name}</div>
                        <div class="text-[9px] text-slate-500 uppercase mt-1 tracking-widest">ID: ${p.id}</div>
                    </td>
                    <td class="p-6">
                        <span class="px-2 py-1 bg-yellow-400/10 text-yellow-400 text-[9px] font-bold rounded uppercase border border-yellow-400/20">${p.category}</span>
                    </td>
                    <td class="p-6 text-sm">
                        <div class="font-bold text-white">₹${p.price.toLocaleString('en-IN')}</div>
                        <div class="text-[10px] ${p.stockQuantity < 5 ? 'text-rose-500 font-bold animate-pulse' : 'text-slate-400'} mt-1">Stock: ${p.stockQuantity}</div>
                    </td>
                    <td class="p-6">
                        <div class="flex justify-center gap-2">
                            <button onclick="openImageModal(${p.id})" class="action-icon bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500 hover:text-white">📸</button>
                            <button onclick='editProduct(${JSON.stringify(p)})' class="action-icon bg-indigo-500/10 text-indigo-400 hover:bg-indigo-500 hover:text-white">✏️</button>
                            <button onclick="handleDelete(${p.id})" class="action-icon bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openImageModal(id) {
            activeId = id;
            selectedFiles = [null, null, null, null];
            document.getElementById('target-id').innerText = id;
            
            for(let i=0; i<4; i++) {
                const img = document.getElementById(`pv-${i}`);
                img.src = `${API_BASE}/${id}/image/${i}?v=${Date.now()}`;
                img.style.display = 'block';
                img.onerror = () => img.style.display = 'none';
            }
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() { document.getElementById('imageModal').classList.add('hidden'); }

        function previewFile(event, index) {
            const file = event.target.files[0];
            if(file) {
                selectedFiles[index] = file;
                const imgTag = document.getElementById(`pv-${index}`);
                imgTag.src = URL.createObjectURL(file);
                imgTag.style.display = 'block';
            }
        }

        async function submitBatchUpload() {
            const fd = new FormData();
            let count = 0;
            selectedFiles.forEach(f => { if(f) { fd.append('files', f); count++; } });

            if(count === 0) return Swal.fire("Notice", "Select at least one new image first.", "info");

            Swal.fire({ title: 'Uploading to Cloud...', didOpen: () => Swal.showLoading(), background: '#0f172a', color: '#fff' });

            try {
                const res = await fetch(`${API_BASE}/${activeId}/upload-images`, {
                    method: 'POST',
                    headers: { 'X-API-KEY': API_KEY },
                    body: fd
                });
                if(res.ok) {
                    Swal.fire({ icon: 'success', title: 'Gallery Updated!', timer: 1500, background: '#0f172a', color: '#fff' });
                    closeImageModal();
                    refreshData();
                }
            } catch (err) { Swal.fire("Error", "Cloud sync failed.", "error"); }
        }

        async function openAddModal() {
            const { value: f } = await Swal.fire({
                title: 'New Product', background: '#0f172a', color: '#fff',
                html: `<input id="n-name" placeholder="Name" class="input-premium"><input id="n-price" type="number" placeholder="Price" class="input-premium"><input id="n-stock" type="number" placeholder="Stock" class="input-premium"><input id="n-cat" placeholder="Category" class="input-premium">`,
                preConfirm: () => ({ name: document.getElementById('n-name').value, price: document.getElementById('n-price').value, stockQuantity: document.getElementById('n-stock').value, category: document.getElementById('n-cat').value })
            });
            if(f) {
                await fetch(`${API_BASE}/add`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-API-KEY': API_KEY }, body: JSON.stringify(f) });
                refreshData();
            }
        }

        async function editProduct(p) {
            const { value: f } = await Swal.fire({
                title: 'Update SKU', background: '#0f172a', color: '#fff',
                html: `<input id="e-name" class="input-premium" value="${p.name}"><input id="e-price" type="number" class="input-premium" value="${p.price}"><input id="e-stock" type="number" class="input-premium" value="${p.stockQuantity}"><input id="e-cat" class="input-premium" value="${p.category}">`,
                preConfirm: () => ({ name: document.getElementById('e-name').value, price: document.getElementById('e-price').value, stockQuantity: document.getElementById('e-stock').value, category: document.getElementById('e-cat').value })
            });
            if(f) {
                await fetch(`${API_BASE}/update/${p.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-API-KEY': API_KEY }, body: JSON.stringify(f) });
                refreshData();
            }
        }

        async function handleDelete(id) {
            const res = await Swal.fire({ title: 'Confirm Delete?', text: "Permanent removal", icon: 'warning', showCancelButton: true, confirmButtonColor: '#f43f5e', background: '#0f172a', color: '#fff' });
            if(res.isConfirmed) {
                await fetch(`${API_BASE}/delete/${id}`, { method: 'DELETE', headers: { 'X-API-KEY': API_KEY } });
                refreshData();
            }
        }

        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.product-item').forEach(row => row.style.display = row.innerText.toLowerCase().includes(q) ? '' : 'none');
        }

        function logout() { location.href = "login.html"; }
    </script>
</body>
</html>
