<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique | Premium Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .product-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .image-container { aspect-ratio: 3/4; overflow: hidden; background: #f5f5f4; }
        .product-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .product-card:hover .product-image { transform: scale(1.05); }

/* Hide scrollbar but keep functionality */
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    
    /* Smooth snapping for the images */
    .snap-x {
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
    }
    .snap-center {
        scroll-snap-align: center;
    }
    
    /* Premium Hover Effect */
    .product-card {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 pb-20">

    <nav class="max-w-7xl mx-auto px-6 py-8 flex justify-between items-center">
        <div class="text-2xl font-serif tracking-tighter uppercase">Boutique<span class="text-stone-400">.</span></div>
        <div class="flex items-center gap-6">
            <span class="text-sm font-medium text-stone-500">Welcome, <span id="username" class="text-stone-900 italic">Guest</span></span>
            <button onclick="logout()" class="text-xs uppercase tracking-widest font-bold text-red-500 hover:text-red-700 transition-colors">Logout</button>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 mb-12">
        <h1 class="text-5xl font-serif mb-2">The Collection</h1>
        <p class="text-stone-500 max-w-md">Curated pieces designed for the modern lifestyle. Explore our latest arrivals from NeonDB.</p>
    </header>

    <main class="max-w-7xl mx-auto px-6">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <div class="animate-pulse bg-stone-200 h-96 rounded-xl"></div>
            <div class="animate-pulse bg-stone-200 h-96 rounded-xl"></div>
            <div class="animate-pulse bg-stone-200 h-96 rounded-xl"></div>
            <div class="animate-pulse bg-stone-200 h-96 rounded-xl"></div>
        </div>
    </main>

    <script>
        const API_BASE = "https://boutique-0j9i.onrender.com/api/boutique/admin/products";
        const API_KEY = "my-secret-boutique-key-2026";

        // 1. Session Check
        const userData = JSON.parse(localStorage.getItem('user'));
        if (!userData) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('username').innerText = userData.fullName || userData.email;
        }

        // 2. Fetch Products
        async function loadProducts() {
            try {
                // Note: We send the API_KEY here to get the JSON data
                const response = await fetch(`${API_BASE}/all`, {
                    headers: { 'X-API-KEY': API_KEY }
                });
                const products = await response.json();
                renderProducts(products);
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('product-grid').innerHTML = `
                    <div class="col-span-full text-center py-20 bg-white rounded-2xl border border-stone-200">
                        <p class="text-stone-400">Unable to load collection. Please try again later.</p>
                    </div>`;
            }
        }

        // 3. Render Product Cards
        function renderProducts(products) {
    const grid = document.getElementById('product-grid');
    
    if (products.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-stone-400">No products available yet.</p>`;
        return;
    }

    grid.innerHTML = products.map(p => {
        // Generate the 4 image slots for the slider
        let slidesHtml = '';
        for (let i = 0; i < 4; i++) {
            slidesHtml += `
                <div class="min-w-full snap-center">
                    <img 
                        src="${API_BASE}/${p.id}/image/${i}?v=${Date.now()}" 
                        class="w-full aspect-[3/4] object-cover bg-stone-100"
                        onerror="this.parentElement.remove()" 
                    >
                </div>
            `;
        }

        return `
            <div class="product-card bg-white rounded-3xl overflow-hidden shadow-sm border border-stone-200 group">
                <div class="relative">
                    <div class="flex overflow-x-auto snap-x snap-mandatory scrollbar-hide" id="slider-${p.id}">
                        ${slidesHtml}
                    </div>
                    
                    <div class="absolute bottom-4 left-0 right-0 flex justify-center gap-1.5 pointer-events-none">
                        <div class="w-1.5 h-1.5 rounded-full bg-white/50"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-white/20"></div>
                    </div>
                </div>

                <div class="p-6">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p class="text-[10px] uppercase tracking-widest text-stone-400 font-bold mb-1">${p.category || 'Collection'}</p>
                            <h3 class="text-xl font-serif text-stone-900">${p.name}</h3>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-bold text-stone-900">₹${p.price.toLocaleString('en-IN')}</p>
                            ${p.stockQuantity < 5 ? '<p class="text-[9px] text-red-500 font-bold uppercase animate-pulse">Low Stock</p>' : ''}
                        </div>
                    </div>

                    <p class="text-stone-500 text-sm leading-relaxed mb-4 line-clamp-2 hover:line-clamp-none transition-all cursor-pointer" title="Click to expand">
                        ${p.description || 'No description provided for this premium piece.'}
                    </p>

                    <button class="w-full bg-stone-900 text-white py-3 rounded-xl font-bold text-sm hover:bg-stone-800 transition-all active:scale-95">
                        View Details
                    </button>
                </div>
            </div>
        `;
    }).join('');
}

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        // Initial Load
        loadProducts();
    </script>
</body>
</html>
