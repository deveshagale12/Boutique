<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique | Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Power BI Style Glass Cards */
        .stat-card {
            background: white;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-3px); }

        /* Custom Scrollbar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        /* Mobile Bottom Session Bar */
        .mobile-session-bar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e2e8f0;
        }

        .product-img { transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover .product-img { transform: scale(1.05); }
    </style>
</head>
<body class="text-slate-900 pb-24 sm:pb-10">

    <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-serif tracking-tighter uppercase">Boutique<span class="text-indigo-600">.</span></div>
            <div class="flex items-center gap-4">
                <div class="hidden sm:block text-right border-r pr-4 border-slate-200">
                    <p class="text-[10px] uppercase font-bold text-slate-400">Current Session</p>
                    <p id="username" class="text-sm font-semibold text-slate-700">Guest</p>
                </div>
                <button onclick="logout()" class="text-xs font-bold text-red-500 hover:text-red-700 transition-colors uppercase tracking-widest">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 pt-8">
        
        <div class="mb-10">
            <h2 class="text-sm font-bold uppercase tracking-[0.2em] text-slate-400 mb-6">Market Overview</h2>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="stat-card p-6 rounded-2xl shadow-sm">
                    <p class="text-slate-500 text-xs font-medium mb-1">Total Orders</p>
                    <h3 id="stat-total-orders" class="text-2xl font-bold text-slate-900">0</h3>
                </div>
                <div class="stat-card p-6 rounded-2xl shadow-sm border-l-4 border-l-indigo-500">
                    <p class="text-slate-500 text-xs font-medium mb-1">Items in Cart</p>
                    <h3 id="stat-cart-items" class="text-2xl font-bold text-slate-900">0</h3>
                </div>
                <div class="stat-card p-6 rounded-2xl shadow-sm">
                    <p class="text-slate-500 text-xs font-medium mb-1">Active Status</p>
                    <h3 class="text-sm font-bold text-emerald-500 uppercase tracking-wide">Live Connection</h3>
                </div>
                <div class="stat-card p-6 rounded-2xl shadow-sm">
                    <p class="text-slate-500 text-xs font-medium mb-1">Total Spending</p>
                    <h3 id="stat-total-spend" class="text-2xl font-bold text-slate-900">₹0</h3>
                </div>
            </div>
        </div>

        <div class="mb-16">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-serif">Premium Catalog</h2>
                <span class="bg-indigo-50 text-indigo-700 text-[10px] font-bold px-3 py-1 rounded-full uppercase">New Season</span>
            </div>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                </div>
        </div>

        <hr class="border-slate-200 mb-16">

        <div class="mb-20">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-serif">Order Logistics</h2>
                <button onclick="loadMyOrders()" class="text-xs text-indigo-600 font-bold hover:underline">Refresh Data</button>
            </div>
            <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 text-[10px] uppercase font-bold text-slate-400">Order ID</th>
                                <th class="px-6 py-4 text-[10px] uppercase font-bold text-slate-400">Product Details</th>
                                <th class="px-6 py-4 text-[10px] uppercase font-bold text-slate-400">Qty</th>
                                <th class="px-6 py-4 text-[10px] uppercase font-bold text-slate-400">Status</th>
                            </tr>
                        </thead>
                        <tbody id="order-history-table" class="divide-y divide-slate-100">
                            </tbody>
                    </table>
                </div>
                <div id="no-orders-msg" class="hidden p-10 text-center text-slate-400 italic text-sm">
                    No transaction history found for this session.
                </div>
            </div>
        </div>
    </main>

    <div class="sm:hidden fixed bottom-0 left-0 right-0 z-50 mobile-session-bar px-8 py-4 flex justify-between items-center shadow-2xl">
        <div>
            <p class="text-[9px] uppercase font-bold text-slate-400">Logged in</p>
            <p id="mobile-username" class="text-xs font-bold text-slate-800 italic">User</p>
        </div>
        <button onclick="logout()" class="bg-red-50 text-red-500 text-[10px] font-bold px-6 py-2.5 rounded-xl uppercase tracking-wider">
            Logout
        </button>
    </div>

    <script>
        const API_BASE = "https://boutique-0j9i.onrender.com/api/boutique";
        const API_KEY = "my-secret-boutique-key-2026";
        const userData = JSON.parse(localStorage.getItem('user'));

        if (!userData) {
            window.location.href = 'user-auth.html';
        } else {
            const name = userData.fullName || userData.email || "Member";
            document.getElementById('username').innerText = name;
            document.getElementById('mobile-username').innerText = name;
        }

        window.onload = () => {
            fetchProducts();
            loadMyOrders();
        };

        // PRODUCT SESSION LOGIC
        async function fetchProducts() {
            try {
                const res = await fetch(`${API_BASE}/admin/products/all`, { headers: { 'X-API-KEY': API_KEY } });
                const products = await res.json();
                renderProducts(products);
            } catch (err) {
                console.error(err);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="product-card group bg-white border border-slate-200 rounded-[2rem] overflow-hidden shadow-sm hover:shadow-xl transition-all">
                    <div class="overflow-hidden bg-slate-100 aspect-[4/5]">
                        <img src="${API_BASE}/admin/products/${p.id}/image/0" class="product-img w-full h-full object-cover">
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="font-bold text-slate-800 text-lg">${p.name}</h3>
                            <p class="font-bold text-indigo-600">₹${p.price.toLocaleString()}</p>
                        </div>
                        <button onclick="placeOrder(${p.id}, '${p.name}')" 
                                class="w-full bg-slate-900 text-white py-4 rounded-2xl text-[11px] font-bold uppercase tracking-widest hover:bg-indigo-600 transition-colors shadow-lg shadow-indigo-100">
                            Book Order
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ORDER HISTORY SESSION LOGIC (Filtering by Session User)
        async function loadMyOrders() {
            try {
                const res = await fetch(`${API_BASE}/orders/admin/all`, { headers: { 'X-API-KEY': API_KEY } });
                const allOrders = await res.json();
                
                const currentUserId = String(userData.id || userData.userId);
                const myOrders = allOrders.filter(o => o.user && String(o.user.id) === currentUserId);
                
                updateStats(myOrders);
                renderOrderTable(myOrders);
            } catch (err) {
                console.error("Session History Sync Error", err);
            }
        }

        function updateStats(orders) {
            document.getElementById('stat-total-orders').innerText = orders.length;
            const spend = orders.reduce((acc, curr) => acc + (curr.product ? curr.product.price * curr.quantity : 0), 0);
            document.getElementById('stat-total-spend').innerText = '₹' + spend.toLocaleString();
        }

        function renderOrderTable(orders) {
            const tbody = document.getElementById('order-history-table');
            const msg = document.getElementById('no-orders-msg');
            
            if (orders.length === 0) {
                tbody.innerHTML = '';
                msg.classList.remove('hidden');
                return;
            }

            msg.classList.add('hidden');
            tbody.innerHTML = orders.map(o => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-5 text-xs font-mono font-bold text-slate-400">#${o.id}</td>
                    <td class="px-6 py-5">
                        <p class="text-sm font-bold text-slate-800">${o.product ? o.product.name : 'Unknown Item'}</p>
                        <p class="text-[10px] text-slate-400 italic">${o.product ? o.product.category : 'Boutique'}</p>
                    </td>
                    <td class="px-6 py-5 text-sm font-medium">${o.quantity}</td>
                    <td class="px-6 py-5">
                        <span class="px-3 py-1 rounded-full text-[9px] font-bold uppercase tracking-widest 
                            ${o.status === 'ACCEPTED' ? 'bg-emerald-100 text-emerald-700' : 
                              o.status === 'REJECTED' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}">
                            ${o.status || 'PROCESSING'}
                        </span>
                    </td>
                </tr>
            `).reverse().join('');
        }

        async function placeOrder(productId, productName) {
            const { value: qty } = await Swal.fire({
                title: 'Confirm Booking',
                text: `How many ${productName} would you like?`,
                input: 'number',
                inputValue: 1,
                inputAttributes: { min: 1, max: 10 },
                showCancelButton: true,
                confirmButtonColor: '#4f46e5'
            });

            if (qty) {
                const currentUserId = userData.id || userData.userId;
                const url = new URL(`${API_BASE}/orders/book`);
                url.searchParams.append('userId', currentUserId);
                url.searchParams.append('productId', productId);
                url.searchParams.append('qty', qty);

                const res = await fetch(url.toString(), { method: 'POST', headers: { 'X-API-KEY': API_KEY } });
                if (res.ok) {
                    Swal.fire('Success', 'Order logged in current session.', 'success');
                    loadMyOrders();
                }
            }
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'user-auth.html';
        }
    </script>
</body>
</html>
