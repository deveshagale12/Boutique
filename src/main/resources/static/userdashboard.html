<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Boutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 p-8">
    <div class="max-w-2xl mx-auto bg-white p-10 rounded-xl shadow-sm border border-stone-200">
        <h1 class="text-3xl font-serif mb-4">Hello, <span id="username" class="text-stone-600 italic">Guest</span></h1>
        <p class="text-stone-500 mb-8">Welcome to your premium boutique dashboard. Your profile details are securely loaded.</p>
        
        <button onclick="logout()" class="bg-red-50 text-red-600 px-6 py-2 rounded border border-red-100 hover:bg-red-100 transition-colors">
            Logout
        </button>
    </div>

    <script>
        // Check if user is logged in
        const userData = JSON.parse(localStorage.getItem('user'));
        if (!userData) {
            window.location.href = 'user-auth.html';
        } else {
            document.getElementById('username').innerText = userData.fullName || userData.email;
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'user-auth.html';
        }
    </script>
</body>
</html>
