<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique | Admin Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; }
        .serif { font-family: 'Playfair Display', serif; }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .input-dark {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .input-dark:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        .loader {
            width: 18px; height: 18px;
            border: 2px solid #fff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden">

    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-900/20 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-900/20 rounded-full blur-[120px]"></div>

    <div class="relative z-10 w-full max-w-md animate__animated animate__zoomIn">
        
        <div class="text-center mb-10">
            <h1 class="serif text-4xl text-white tracking-widest uppercase mb-2">Boutique</h1>
            <p class="text-slate-400 text-xs tracking-[0.3em] uppercase">Management Portal</p>
        </div>

        <div class="glass-panel rounded-3xl p-8 lg:p-10 shadow-2xl">
            
            <div class="mb-8">
                <h2 id="form-title" class="text-2xl font-bold text-white mb-2">Admin Login</h2>
                <p id="form-desc" class="text-slate-400 text-sm">Authorized personnel only.</p>
            </div>

            <form id="admin-form" class="space-y-5">
                <div id="register-fields" class="hidden space-y-5">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Full Name</label>
                        <input type="text" id="fullName" class="input-dark w-full rounded-xl px-4 py-3 outline-none" placeholder="Enter full name">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Email Address</label>
                    <input type="email" id="email" required class="input-dark w-full rounded-xl px-4 py-3 outline-none" placeholder="admin@boutique.com">
                </div>

                <div id="password-container">
                    <label id="password-label" class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Password</label>
                    <input type="password" id="password" required class="input-dark w-full rounded-xl px-4 py-3 outline-none" placeholder="••••••••">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-indigo-500/20 mt-6 active:scale-[0.98]">
                    <span id="btn-text">Sign In</span>
                </button>
            </form>

            <div class="mt-8 flex flex-col items-center space-y-4">
                <div id="auth-toggle-area" class="text-xs text-slate-400">
                    <span id="toggle-text">New staff member?</span>
                    <button id="toggle-btn" class="text-indigo-400 font-bold ml-1 hover:text-indigo-300">Create Admin Account</button>
                </div>
                <button id="forgot-btn" class="text-[10px] uppercase tracking-widest text-slate-500 hover:text-white transition-colors">Forgot Credentials?</button>
            </div>
        </div>

        <p class="text-center mt-10 text-[10px] text-slate-600 tracking-[0.2em] uppercase">
            System Node: Boutique-0j9i-v3
        </p>
    </div>

    <script>
        const API_BASE = "https://boutique-0j9i.onrender.com/api/boutique/admin";
        const API_KEY = "my-secret-boutique-key-2026"; // Ensure this matches Render Env

        let currentMode = 'LOGIN'; // Modes: LOGIN, REGISTER, FORGOT

        const elements = {
            form: document.getElementById('admin-form'),
            title: document.getElementById('form-title'),
            desc: document.getElementById('form-desc'),
            regFields: document.getElementById('register-fields'),
            submitBtn: document.getElementById('submit-btn'),
            btnText: document.getElementById('btn-text'),
            toggleBtn: document.getElementById('toggle-btn'),
            toggleText: document.getElementById('toggle-text'),
            forgotBtn: document.getElementById('forgot-btn'),
            passLabel: document.getElementById('password-label'),
            passInput: document.getElementById('password')
        };

        // UI Mode Switching Logic
        function switchMode(mode) {
            currentMode = mode;
            elements.regFields.classList.add('hidden');
            elements.passLabel.innerText = "Password";
            elements.passInput.placeholder = "••••••••";

            if (mode === 'REGISTER') {
                elements.title.innerText = "Add Administrator";
                elements.desc.innerText = "Register a new secure admin profile.";
                elements.btnText.innerText = "Create Admin";
                elements.regFields.classList.remove('hidden');
                elements.toggleText.innerText = "Already have access?";
                elements.toggleBtn.innerText = "Login Instead";
            } else if (mode === 'LOGIN') {
                elements.title.innerText = "Admin Login";
                elements.desc.innerText = "Authorized personnel only.";
                elements.btnText.innerText = "Sign In";
                elements.toggleText.innerText = "New staff member?";
                elements.toggleBtn.innerText = "Create Admin Account";
            } else if (mode === 'FORGOT') {
                elements.title.innerText = "Reset Password";
                elements.desc.innerText = "Enter email and your desired new password.";
                elements.passLabel.innerText = "New Password";
                elements.btnText.innerText = "Update Password";
                elements.toggleText.innerText = "Remembered it?";
                elements.toggleBtn.innerText = "Back to Login";
            }
        }

        elements.toggleBtn.onclick = () => switchMode(currentMode === 'LOGIN' ? 'REGISTER' : 'LOGIN');
        elements.forgotBtn.onclick = () => switchMode('FORGOT');

        // Form Handler
        elements.form.onsubmit = async (e) => {
            e.preventDefault();
            elements.btnText.innerHTML = '<span class="loader"></span>';
            elements.submitBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            let url = `${API_BASE}/login`;
            let method = 'POST';
            let body = { email, password };

            if (currentMode === 'REGISTER') {
                url = `${API_BASE}/register`;
                body = { email, password, fullName: document.getElementById('fullName').value };
            } else if (currentMode === 'FORGOT') {
                url = `${API_BASE}/forgot-password`;
                method = 'PUT';
                body = { email, newPassword: password };
            }

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'X-API-KEY': API_KEY },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (response.ok) {
                    if (currentMode === 'LOGIN') {
                        Swal.fire({
                            icon: 'success',
                            title: 'Access Granted',
                            text: `Welcome back, ${data.adminName}`,
                            timer: 2000,
                            showConfirmButton: false,
                            background: '#1e293b', color: '#fff'
                        }).then(() => {
                            localStorage.setItem('admin_session', JSON.stringify(data));
                            window.location.href = 'admindash.html';
                        });
                    } else {
                        Swal.fire({ 
                            icon: 'success', 
                            title: 'Success', 
                            text: data.message || 'Operation successful',
                            confirmButtonColor: '#4f46e5'
                        });
                        switchMode('LOGIN');
                    }
                } else {
                    Swal.fire({ icon: 'error', title: 'Action Denied', text: data.message || 'Verification failed' });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Offline', text: 'Admin server is currently unreachable.' });
            } finally {
                elements.btnText.innerText = (currentMode === 'LOGIN' ? "Sign In" : (currentMode === 'REGISTER' ? "Create Admin" : "Update Password"));
                elements.submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
